# Site
title: Th1ry Blog
subtitle: GitHub Trending 最新开源项目推荐
description: 每日更新 GitHub 热门开源项目，提供中文介绍和使用教程
author: Th1ry
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://th1ry.uk
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: post
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Theme
theme: landscape

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
date_format: YYYY-MM-DD
time_format: HH:mm:ss
# Arguments passed to the 3rd-party date_engine
pretty_dates:
  source: "moment"

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Deployment
deploy:
  type: git
  repo: https://github.com/Th1ry/Th1ry.github.io.git
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
